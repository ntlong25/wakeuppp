name: WakeMission
options:
  bundleIdPrefix: com.wakemission
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WakeMission:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WakeMission
    info:
      path: WakeMission/Info.plist
      properties:
        CFBundleDisplayName: WakeMission
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        NSAlarmKitUsageDescription: WakeMission requires AlarmKit permission to schedule prominent wake-up alarms that sound reliably through Silent and Focus modes.
        NSCameraUsageDescription: WakeMission uses the camera solely to verify physical completion of your photo wake-up mission (such as reaching your bathroom sink).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.wakemission.app
      INFOPLIST_FILE: WakeMission/Info.plist
      GENERATE_INFOPLIST_FILE: NO
    frameworks:
      - framework: AlarmKit.framework
        implicit: true
      - framework: AppIntents.framework
        implicit: true
      - framework: AVFoundation.framework
        implicit: true
      - framework: Vision.framework
        implicit: true
      - framework: SwiftData.framework
        implicit: true

  WakeMissionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WakeMissionTests
    dependencies:
      - target: WakeMission
    settings:
      GENERATE_INFOPLIST_FILE: YES

schemes:
  WakeMission:
    build:
      targets:
        WakeMission: all
    test:
      targets:
        - WakeMissionTests
